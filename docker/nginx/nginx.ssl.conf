# Production configuration once certificates exist.
# Expects: /etc/nginx/ssl/live/<domain>/fullchain.pem and privkey.pem (Let's Encrypt layout)
# or /etc/nginx/ssl/fullchain.pem + /etc/nginx/ssl/privkey.pem from the school's certificate supplier.
# Set SCHOOL_DOMAIN below, then in .env: NGINX_CONF=./docker/nginx/nginx.ssl.conf

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" rid=$request_id rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    upstream backend {
        least_conn;
        server backend:4000 max_fails=3 fail_timeout=15s;
        keepalive 64;
    }

    upstream frontend {
        server frontend:3000 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    # Port 80: certificate challenges and a redirect to HTTPS.
    server {
        listen 80;
        server_name SCHOOL_DOMAIN www.SCHOOL_DOMAIN;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name SCHOOL_DOMAIN www.SCHOOL_DOMAIN;

        ssl_certificate     /etc/nginx/ssl/live/SCHOOL_DOMAIN/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/SCHOOL_DOMAIN/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        limit_conn perip 50;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location /api/v1/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://backend;
            include /etc/nginx/proxy_params_sombetini;
        }

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://backend;
            include /etc/nginx/proxy_params_sombetini;
        }

        location /uploads/ {
            proxy_pass http://backend;
            include /etc/nginx/proxy_params_sombetini;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location / {
            proxy_pass http://frontend;
            include /etc/nginx/proxy_params_sombetini;
        }
    }
}
